<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI කෘතිම ඇස</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        #video-container { width: 100%; border: 3px solid #00ffcc; border-radius: 15px; overflow: hidden; background: black; aspect-ratio: 1/1; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        button { background: #00ffcc; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; margin: 20px 0; box-shadow: 0 4px 15px rgba(0,255,204,0.3); }
        #status { background: #333; padding: 10px; border-radius: 10px; margin-top: 10px; border-left: 5px solid #00ffcc; }
        #error-log { color: #ff5555; font-size: 12px; margin-top: 10px; text-align: left; background: #000; padding: 5px; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👁️ AI කෘතිම ඇස</h1>
        <p>සල්ලි නෝට්ටුව කැමරාවට පෙන්වන්න</p>
        
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
        </div>

        <button id="start-btn">ඇස පණගන්වන්න</button>
        
        <div id="status">මොළය සූදානම් කරමින්...</div>
        <div id="error-log" id="error-display"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const status = document.getElementById('status');
        const errorLog = document.getElementById('error-log');

        function logError(msg) {
            errorLog.style.display = 'block';
            errorLog.innerHTML += "> " + msg + "<br>";
        }

        startBtn.addEventListener('click', async () => {
            status.innerText = "කැමරාව සොයමින්...";
            logError("කැමරාවට සම්බන්ධ වීමට උත්සාහ කරයි...");

            const constraints = {
                video: { facingMode: { exact: "environment" } } // පිටුපස කැමරාව ඉල්ලයි
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                status.innerText = "ඇස විවෘතයි! නෝට්ටුව පෙන්වන්න...";
                logError("සාර්ථකයි!");
            } catch (err) {
                logError("ප්‍රශ්නය: " + err.name);
                
                if (err.name === "OverconstrainedError" || err.name === "NotFoundError") {
                    logError("පිටුපස කැමරාව හමු වුනේ නැත. සාමාන්‍ය කැමරාව උත්සාහ කරයි...");
                    try {
                        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        video.srcObject = fallbackStream;
                        status.innerText = "ඇස විවෘතයි (මුහුණත)!";
                    } catch (e) {
                        status.innerText = "කැමරාව පණගැන්විය නොහැක!";
                        logError("අවසාන දෝෂය: " + e.message);
                    }
                } else if (err.name === "NotAllowedError") {
                    status.innerText = "කැමරා අවසරය නැත (Permission Denied)!";
                    logError("කරුණාකර Browser එකේ Camera Permission ලබා දෙන්න.");
                } else {
                    status.innerText = "අදෘශ්‍යමාන දෝෂයකි!";
                    logError(err.message);
                }
            }
        });
    </script>
</body>
</html>
