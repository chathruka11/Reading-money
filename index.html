<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Companion v6</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; text-align: center; margin: 0; }
        #video { width: 100vw; height: 60vh; object-fit: cover; border-bottom: 4px solid #8e44ad; }
        .brain-box { height: 40vh; padding: 20px; background: #111; display: flex; flex-direction: column; justify-content: center; }
        #ai-status { color: #8e44ad; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; }
        #main-output { font-size: 26px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        #sub-output { font-size: 16px; color: #aaa; }
        .btn-activate { background: #8e44ad; color: #fff; border: none; padding: 20px 50px; font-size: 20px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    
    <div class="brain-box">
        <div id="ai-status">AI පද්ධතිය ක්‍රියාත්මකයි</div>
        <div id="main-output">මම සූදානම්.</div>
        <div id="sub-output">ඇස පණගන්වා මට වටපිටාව පෙන්වන්න.</div>
        <br>
        <button id="start-btn" class="btn-activate">මොළය පණගන්වන්න</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

    <script>
        let model;
        let lastMessage = "";
        const video = document.getElementById('video');
        const mainOut = document.getElementById('main-output');
        const subOut = document.getElementById('sub-output');
        const startBtn = document.getElementById('start-btn');

        async function init() {
            mainOut.innerText = "බුද්ධිය අවදි වෙමින්...";
            model = await mobilenet.load();
            mainOut.innerText = "මම දැන් සූදානම්.";
        }

        startBtn.addEventListener('click', async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            startBtn.style.display = 'none';
            setInterval(thinkAndSpeak, 4000); 
        });

        async function thinkAndSpeak() {
            if (!model) return;
            const predictions = await model.classify(video);
            const top = predictions[0];

            if (top.probability > 0.5) {
                const label = top.className.toLowerCase();
                let result = analyzeContext(label);

                if (result.main !== lastMessage) {
                    mainOut.innerText = result.main;
                    subOut.innerText = result.advice;
                    speak(result.main + ". " + result.advice);
                    lastMessage = result.main;
                }
            }
        }

        function analyzeContext(label) {
            // ChatGPT වගේ තර්කානුකූලව සිතීම (Reasoning Logic)
            if (label.includes('person') || label.includes('man')) {
                return { main: "පුද්ගලයෙක් ඉදිරියේ සිටිනවා", advice: "ඔහු සමඟ කතා කිරීමට හෝ අවධානයෙන් සිටීමට පුළුවන්." };
            }
            if (label.includes('stairs') || label.includes('step')) {
                return { main: "පඩිපෙළක් හමු වුණා", advice: "කරුණාකර පියවර තබන විට ප්‍රවේශම් වන්න." };
            }
            if (label.includes('car') || label.includes('truck') || label.includes('bus')) {
                return { main: "වාහනයක් පෙනෙනවා", advice: "ඔබ පාරේ සිටී නම් ආරක්ෂිත තැනකට වන්න." };
            }
            if (label.includes('money') || label.includes('bill')) {
                return { main: "මුදල් නෝට්ටුවක්", advice: "එහි වටිනාකම තහවුරු කර ගැනීමට තව ටිකක් ලං කරන්න." };
            }
            if (label.includes('door') || label.includes('entrance')) {
                return { main: "දොරක් තිබෙනවා", advice: "ඔබට ඇතුල් වීමට අවශ්‍ය නම් ඉදිරියට යන්න." };
            }

            let thing = label.split(',')[0];
            return { main: "මම " + thing + " එකක් දකිනවා", advice: "මේ පිළිබඳ වැඩි විස්තර අවශ්‍යද?" };
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'si-LK';
            window.speechSynthesis.speak(utterance);
        }

        init();
    </script>
</body>
</html>
