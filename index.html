
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Eye for Blind</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; margin: 0; overflow: hidden; }
        #video { width: 100vw; height: 70vh; object-fit: cover; border-bottom: 4px solid #00ffcc; }
        .info-panel { height: 30vh; padding: 15px; background: #111; display: flex; flex-direction: column; justify-content: center; }
        #status { font-size: 24px; color: #00ffcc; font-weight: bold; }
        #description { font-size: 18px; color: #ccc; margin-top: 10px; }
        .btn-start { background: #00ffcc; color: #000; border: none; padding: 20px; font-size: 22px; font-weight: bold; width: 90%; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    
    <div class="info-panel">
        <div id="status">ඇස පණගන්වන්න...</div>
        <div id="description">වටපිටාව විස්තර කිරීමට සූදානම්.</div>
        <button class="btn-start" id="start-btn">ඇස පණගන්වන්න</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

    <script>
        let model;
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const descText = document.getElementById('description');
        const startBtn = document.getElementById('start-btn');

        async function initAI() {
            statusText.innerText = "මොළය අවදි වෙමින්...";
            model = await mobilenet.load();
            statusText.innerText = "දැන් ඇස පණගන්වන්න";
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                statusText.innerText = "පරීක්ෂා කරමින්...";
                setInterval(analyzeFrame, 3000); // සෑම තත්පර 3කට වරක්ම වටපිටාව බලයි
            } catch (err) {
                alert("කැමරාව වැඩ නැත: " + err.message);
            }
        });

        async function analyzeFrame() {
            if (!model) return;
            const predictions = await model.classify(video);
            
            // ඉහළම ප්‍රතිඵලය ලබා ගැනීම
            const topResult = predictions[0];
            let message = "";

            // සරල සිංහල පරිවර්තනය (උදාහරණ කිහිපයක්)
            const label = topResult.className.toLowerCase();
            
            if(label.includes('money') || label.includes('paper')) {
                message = "මුදල් නෝට්ටුවක් විය හැක";
            } else if(label.includes('person') || label.includes('man')) {
                message = "මිනිසෙකු පෙනේ";
            } else if(label.includes('chair') || label.includes('table')) {
                message = "ගෘහ භාණ්ඩ පෙනේ";
            } else {
                message = "මෙය " + topResult.className + " එකක් විය හැක";
            }

            descText.innerText = message;
            speak(message);
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'si-LK';
            synth.speak(utterance);
        }

        initAI();
    </script>
</body>
</html>
